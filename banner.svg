<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Claude Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".78" cy=".5" r=".55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2430" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      @keyframes p{50%{opacity:.35}} .pulse{animation:p 1.4s infinite}
      @keyframes f{0%{transform:translate(0,0)}50%{transform:translate(0,-4px)}100%{transform:translate(0,0)}}
      .float{animation:f 4s ease-in-out infinite}
      .float2{animation:f 5s ease-in-out infinite .8s}
      .float3{animation:f 6s ease-in-out infinite 1.6s}
    </style>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#halo)"/>
  <rect x="0" y="398" width="1200" height="2" fill="url(#glow)"/>

  <!-- title -->
  <g class="sans">
    <text x="64" y="150" font-size="56" font-weight="700" fill="#e6e8ee" letter-spacing="-1">claude-dashboard</text>
    <text x="64" y="192" font-size="20" fill="#8b93a7">every running Claude Code session on one page</text>
    <text x="66" y="240" font-size="15" fill="#8b93a7" class="mono">
      <tspan fill="#f59e0b">$</tspan> npm start   <tspan fill="#3fb950">→</tspan>   http://localhost:7777
    </text>
  </g>

  <!-- session cards -->
  <g transform="translate(690,70)"><g class="float">
    <rect width="300" height="86" rx="14" fill="#12151d" stroke="#3a2f10"/>
    <circle cx="26" cy="26" r="6" fill="#f59e0b" class="pulse"/>
    <circle cx="26" cy="26" r="12" fill="#f59e0b" opacity=".25" filter="url(#blur)"/>
    <text x="44" y="31" font-size="15" fill="#e6e8ee" font-weight="600" class="sans">api-server</text>
    <text x="230" y="31" font-size="12" fill="#8b93a7" class="mono">busy</text>
    <text x="44" y="56" font-size="12" fill="#f59e0b" class="mono">~/work/api</text>
    <rect x="44" y="64" width="190" height="4" rx="2" fill="#1f2430"/><rect x="44" y="64" width="120" height="4" rx="2" fill="#f59e0b"/>
  </g></g>
  <g transform="translate(760,176)"><g class="float2">
    <rect width="300" height="86" rx="14" fill="#12151d" stroke="#4a1d1d"/>
    <circle cx="26" cy="26" r="6" fill="#f85149"/>
    <circle cx="26" cy="26" r="12" fill="#f85149" opacity=".3" filter="url(#blur)"/>
    <text x="44" y="31" font-size="15" fill="#e6e8ee" font-weight="600" class="sans">web-frontend</text>
    <text x="216" y="31" font-size="12" fill="#8b93a7" class="mono">waiting</text>
    <text x="44" y="56" font-size="12" fill="#f59e0b" class="mono">~/work/web</text>
    <rect x="44" y="64" width="190" height="4" rx="2" fill="#1f2430"/><rect x="44" y="64" width="190" height="4" rx="2" fill="#f85149"/>
  </g></g>
  <g transform="translate(690,282)"><g class="float3">
    <rect width="300" height="86" rx="14" fill="#12151d" stroke="#1f2430"/>
    <circle cx="26" cy="26" r="6" fill="#3fb950"/>
    <text x="44" y="31" font-size="15" fill="#e6e8ee" font-weight="600" class="sans">claude-dashboard</text>
    <text x="236" y="31" font-size="12" fill="#8b93a7" class="mono">idle</text>
    <text x="44" y="56" font-size="12" fill="#f59e0b" class="mono">~/projects</text>
    <rect x="44" y="64" width="190" height="4" rx="2" fill="#1f2430"/><rect x="44" y="64" width="40" height="4" rx="2" fill="#3fb950"/>
  </g></g>

  <!-- prompt line -->
  <g class="mono" transform="translate(64,300)">
    <rect width="520" height="48" rx="12" fill="#0f1117" stroke="#1f2430"/>
    <text x="18" y="30" font-size="15" fill="#f59e0b">›</text>
    <text x="36" y="30" font-size="15" fill="#e6e8ee">run the tests again and push when green</text>
    <rect x="432" y="18" width="9" height="16" fill="#f59e0b" class="pulse"/>
    <rect x="456" y="10" width="50" height="28" rx="8" fill="#f59e0b"/>
    <text x="463" y="29" font-size="13" fill="#111" font-weight="700" class="sans">Send</text>
  </g>
</svg>
